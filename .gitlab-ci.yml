image: node:24-bookworm
stages: [setup, verify, deploy]
install:
  stage: setup
  cache:
    paths:
    - .cache/npm
  script:
  - &npm_install
    npm install --quiet --no-progress --cache=.cache/npm
lint:
  stage: verify
  cache: &pull_cache
    policy: pull
    paths:
    - .cache/npm
  script:
  - *npm_install
  - node_modules/.bin/gulp lint
bundle-stable:
  stage: deploy
  rules:
  - if: $CI_COMMIT_BRANCH == "main" && $CI_PROJECT_PATH == "fedora/docs/docs-website/ui-bundle"
  cache: *pull_cache
  script:
  - *npm_install
  - node_modules/.bin/gulp bundle
  artifacts:
    paths:
    - build/ui-bundle.zip
bundle-stg:
  stage: deploy
  rules:
  - if: $CI_COMMIT_BRANCH == "stg" && $CI_PROJECT_PATH == "fedora/docs/docs-website/ui-bundle"
  cache: *pull_cache
  script:
  - *npm_install
  - node_modules/.bin/gulp bundle
  artifacts:
    paths:
    - build/ui-bundle.zip
bundle-dev:
  stage: deploy
  rules:
  - if: $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "stg"
  cache: *pull_cache
  script:
  - *npm_install
  - node_modules/.bin/gulp bundle
  artifacts:
    expire_in: 1 day # unless marked as keep from job page
    paths:
    - build/ui-bundle.zip
pages:
  stage: deploy
  rules:
  - if: $CI_COMMIT_BRANCH == "main" && $CI_PROJECT_PATH == "fedora/docs/docs-website/ui-bundle"
  cache: *pull_cache
  script:
  - *npm_install
  - node_modules/.bin/gulp preview:build
  # FIXME figure out a way to avoid copying these files to preview site
  - rm -rf public/_/{helpers,layouts,partials}
  artifacts:
    paths:
    - public
